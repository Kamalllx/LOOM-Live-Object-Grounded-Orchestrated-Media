# Local hooks run through the project's uv environment (same tool versions as CI).
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: ruff
        name: ruff lint
        entry: uv run ruff check
        language: system
        types: [python]
      - id: mypy
        name: mypy --strict (loom/)
        entry: uv run mypy
        language: system
        pass_filenames: false
        files: ^loom/
      - id: contracts
        name: generated contracts up to date
        entry: uv run loom contracts export --check
        language: system
        pass_filenames: false
        files: ^loom/core/contracts/
