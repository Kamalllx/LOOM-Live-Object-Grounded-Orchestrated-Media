[project]
name = "loom"
version = "2.0.0.dev0"
description = "LOOM: Live, Object-Grounded, Orchestrated Media (local-only remake)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9,<3",
    "typer>=0.12",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "structlog>=24.1",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pillow>=10.4",
    "manim>=0.19",
]

[project.scripts]
loom = "loom.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "types-pyyaml>=6.0",
    "pre-commit>=3.8",
    "asgi-lifespan>=2.1.0",
    "pytest-timeout>=2.4.0",
]
# One-time setup helpers (model weight downloads); never imported by loom at runtime.
setup = [
    "huggingface-hub>=0.25",
]
# Demo lesson rebuild (loom eval make-demo): local TTS, no cloud.
demo = [
    "kokoro-onnx>=0.4",
    "soundfile>=0.12",
]
# Perception worker (Stage 1): GPU stages run in `python -m loom.worker`, never in the gateway process.
# RTX 50xx (Blackwell, sm_120) needs CUDA 12.8 builds of torch.
perception = [
    "torch>=2.8",
    "torchvision>=0.23",
    "transformers>=4.57",
    "accelerate>=1.0",
    "faster-whisper>=1.2",
    "rapidocr>=3.4",
    "onnxruntime>=1.22",
    "scenedetect[opencv-headless]>=0.6.6",
    "opencv-python-headless>=4.10",
    "pycocotools>=2.0.10",
    "jiwer>=4.0",
    "yt-dlp>=2025.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loom"]

[tool.uv]
default-groups = ["dev", "perception"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.workspace]
members = []

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["packages", "web", "extension", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT"]
ignore = [
    "S101",   # assert is fine in tests and invariants
    "S603",   # subprocess calls are deliberate (worker, ffmpeg, nvidia-smi)
    "S607",   # partial executable paths (ffmpeg, nvidia-smi, ollama) are resolved from PATH on purpose
    "RUF001", "RUF002", "RUF003",  # unicode in strings/docs (H₂O, →) is intended
    "RUF012", # Pydantic copies mutable field defaults per instance; ClassVar would be wrong here
    "ASYNC109", # explicit per-call timeouts are part of the LLM/A2A contracts (spec/03 §4)
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Header", "fastapi.Query", "fastapi.File", "fastapi.Form", "fastapi.Body",
    "typer.Option", "typer.Argument",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PT011", "PT018"]
"loom/eval/**" = ["ASYNC240"]  # CLI-only harness: blocking report I/O between model runs is fine
# report prose, SVG and in-page JS templates: long literal strings read better unbroken
"loom/eval/{report,charts,paper_figures,readme_shots,batch,batch_report,extension_check}.py" = ["ASYNC240", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["loom"]

[[tool.mypy.overrides]]
module = ["kokoro_onnx", "soundfile", "huggingface_hub", "faster_whisper", "faster_whisper.*", "rapidocr", "rapidocr.*", "scenedetect", "scenedetect.*", "cv2", "pycocotools", "pycocotools.*", "jiwer", "yt_dlp", "yt_dlp.*", "transformers", "transformers.*", "torchvision", "torchvision.*"]
ignore_missing_imports = true

# torch / transformers expose many untyped callables; perception code may call them (loom.core stays fully strict)
[[tool.mypy.overrides]]
module = ["loom.perception.*"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "ollama: needs a live local Ollama server (skipped otherwise)",
]
addopts = "-ra --strict-markers"
timeout = 120
