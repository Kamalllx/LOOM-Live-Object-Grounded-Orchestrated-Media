<text x="416.5" y="246" fill="#c0d0df" font-family="Segoe UI,Arial,sans-serif" font-size="16">Return timestamps and citations</text>
<path d="M712.0 216h15" stroke="#7893aa" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="731.0" y="145" width="312.5" height="142" rx="16" fill="#1c293c" stroke="#d2a7ff" stroke-width="1.5"/>
