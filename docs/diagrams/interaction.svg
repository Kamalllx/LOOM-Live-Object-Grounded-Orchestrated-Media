<text x="767.0" y="186" fill="#f4f8ff" font-family="Segoe UI,Arial,sans-serif" font-weight="700" font-size="21">GENERATE</text>
<text x="751.0" y="221" fill="#c0d0df" font-family="Segoe UI,Arial,sans-serif" font-size="16">Answer, quiz or scene plan</text>
