<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="415" viewBox="0 0 1440 415" role="img" aria-labelledby="title desc">
<title id="title">Click to learn</title><desc id="desc">A detected object provides context for a question, quiz, or generated scene.</desc>
