<text x="990.0" y="366" fill="#f4f8ff" font-family="Segoe UI,Arial,sans-serif" font-weight="700" font-size="21">FALL BACK</text>
<text x="974.0" y="401" fill="#c0d0df" font-family="Segoe UI,Arial,sans-serif" font-size="16">Full lesson; generated content removed</text>
<text x="974.0" y="426" fill="#c0d0df" font-family="Segoe UI,Arial,sans-serif" font-size="16">Known objects masked if redaction is on</text>
<text x="62" y="565" fill="#a7bbcc" font-family="Segoe UI,Arial,sans-serif" font-size="16">These checks cover the available graph, not hazards that perception failed to detect.</text></svg>