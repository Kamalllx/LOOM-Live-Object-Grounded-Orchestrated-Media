<rect x="526.0" y="165" width="6" height="25" rx="3" fill="#9bb8ff"/>
<text x="544.0" y="186" fill="#f4f8ff" font-family="Segoe UI,Arial,sans-serif" font-weight="700" font-size="21">02  PERSONALIZE</text>
<text x="528.0" y="221" fill="#c0d0df" font-family="Segoe UI,Arial,sans-serif" font-size="16">Personalizer assembles threads</text>
