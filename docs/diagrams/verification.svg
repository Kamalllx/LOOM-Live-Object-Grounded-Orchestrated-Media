<text x="82.0" y="221" fill="#c0d0df" font-family="Segoe UI,Arial,sans-serif" font-size="16">Curator divides the timeline</text>
<text x="82.0" y="246" fill="#c0d0df" font-family="Segoe UI,Arial,sans-serif" font-size="16">Pedagogy selects learning actions</text>
