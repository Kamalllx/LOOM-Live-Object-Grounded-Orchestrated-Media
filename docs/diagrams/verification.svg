<text x="974.0" y="221" fill="#c0d0df" font-family="Segoe UI,Arial,sans-serif" font-size="16">Guardian schedules object masks</text>
<text x="974.0" y="246" fill="#c0d0df" font-family="Segoe UI,Arial,sans-serif" font-size="16">Critic checks cut and known hazards</text>
