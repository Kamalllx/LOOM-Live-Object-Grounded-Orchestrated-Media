<text x="82.0" y="401" fill="#c0d0df" font-family="Segoe UI,Arial,sans-serif" font-size="16">No outstanding Critic issues</text>
<text x="82.0" y="426" fill="#c0d0df" font-family="Segoe UI,Arial,sans-serif" font-size="16">Deliver the approved cut</text>
