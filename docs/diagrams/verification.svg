<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="595" viewBox="0 0 1440 595" role="img" aria-labelledby="title desc">
<title id="title">A personalized cut with bounded checks</title><desc id="desc">The session mesh proposes a cut; Guardian and Critic inspect the resulting artifact.</desc>
