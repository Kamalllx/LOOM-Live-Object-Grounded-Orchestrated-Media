[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loom-verification"
version = "1.0.0"
description = "LOOM verification service: Critic + bounded loop, Guardian redaction and Manim Animator; candidate-cut.json -> verified-cut.json"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<2",
  "jsonschema>=4.20",
  "opencv-python-headless>=4.9,<4.11",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
]

[project.optional-dependencies]
# LLM providers are optional: with none configured, the Guardian uses its hazard lexicon, the Critic its
# lexical judge and the Animator its template scene, so the service still runs end to end.
llm = ["google-genai>=1.0", "groq>=0.9"]
# Manim renders the explainer clips. Without it explainer requests are reported as unavailable and dropped.
animator = ["manim>=0.18"]
dev = ["pytest>=8"]

[project.scripts]
loom-verification = "loom_verification.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "manim: renders a real Manim scene (deselect with -m 'not manim')",
  "network: calls an external LLM",
]
