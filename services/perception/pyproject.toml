[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loom-perception"
version = "1.0.0"
description = "LOOM perception service: SAM 3.1 + ASR + OCR fused into concept-graph.json"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<2",
  "jsonschema>=4.20",
  "opencv-python-headless>=4.9,<4.11",
  "pillow>=10",
  "faster-whisper>=1.1",
  "rapidocr>=3.0",
  "onnxruntime>=1.18",
  "sentence-transformers>=3.0",
  "pycocotools>=2.0.8",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "google-genai>=1.0",
  "tqdm",
]

[project.optional-dependencies]
# SAM 3.1 needs a CUDA GPU; installed separately (see README) because it pins its own torch stack.
sam = [
  "torch>=2.7",
  "torchvision",
  "sam3 @ git+https://github.com/facebookresearch/sam3@2345a4a",
  "setuptools<81",
  "timm>=1.0.17",
  "ftfy==6.1.1",
  "regex",
  "iopath>=0.1.10",
  "einops",
  "psutil",  # imported by sam3 but not declared by it
  "triton-windows; sys_platform == 'win32'",
]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
loom-perception = "loom_perception.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gpu: needs a CUDA GPU and model weights (deselect with -m 'not gpu')",
  "network: calls external services",
]
